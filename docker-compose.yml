
services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    image: postgres17-pgbackrest:lab
    container_name: laboratorio-postgres17
    restart: unless-stopped

    environment:
      POSTGRES_USER: dba
      POSTGRES_PASSWORD: Laboratorio2026
      POSTGRES_DB: laboratorio

    ports:
      - "5432:5432"


    volumes:
      - postgres_data:/var/lib/postgresql/data
      - pgbackrest_repo:/var/lib/pgbackrest
      - ./pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro


    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=lab archive-push %p

volumes:
  postgres_data:
    external: true
    name: prueba-dba-postgresql17_postgres_data

  pgbackrest_repo:
    external: true
    name: prueba-dba-postgresql17_pgbackrest_repo

